name: Pipeline Calificador de Operaciones

on: 
  [push]:
    branches: [ "main" ]

jobs:
  pipeline-educativo:
    runs-on: ubuntu-latest

    steps:
    #Etapa construcción
    - name: Etapa 1 - Build
      uses: actions/checkout@v4

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pytest flake8

    #Etapa de pruebas
    - name: Etapa 2 - test
      run: |
        python -m pytest test/test_logic.py
    
    # Etapa calidad
    - name: Etapa 3 - Calidad
      run: |
        flake8 src
    
    # Etapa Despliegue
    - name: Etapa 4 - Despliegue
      run: |
        echo "Publicando calificador de operaciones..."